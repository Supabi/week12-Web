name: React App CI/CD

# กำหนดให้ Workflow ทำงานเมื่อมีการ Push โค้ดไปยัง Branch 'main'
on:
  push:
    branches:
      - main

jobs:
  build-and-push-docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: supapornph/week12web:latest

  deploy:
    needs: build-and-push-docker-image
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull supapornph/week12web:latest
            docker stop my-react-app || true
            docker rm my-react-app || true
            docker run -d --name my-react-app -p 80:80 supapornph/week12web:latest
```[cite: 1]

---

### **ขั้นตอนการส่งโค้ดขึ้น GitHub เพื่อเริ่ม Deploy:**

1. บันทึกไฟล์ `ci-cd.yml` (`Ctrl + S` หรือ `Cmd + S`)[cite: 26]
2. คลิกที่ช่อง **Terminal** ด้านล่าง แล้วรันคำสั่งสั่ง Commit และ Push[cite: 1]:
   ```bash
   git add .
   git commit -m "Add CI/CD pipeline"
   git push origin main